{
  "schema_version": 2,
  "ecosystem": {
    "name": "RenCrow",
    "release": "development",
    "compatibility_status": "unpinned"
  },
  "components": {
    "core": {
      "repository": "Nyukimin/RenCrow_CORE",
      "workspace_path": "../RenCrow_CORE",
      "version": "unpinned",
      "required": true,
      "distribution": "binary",
      "role": "Runtime and source of truth for shared Viewer, Agent, Chat, IdleChat, Task, Persona, Memory, approval, route, adapter, and user-facing behavior"
    },
    "portal": {
      "repository": "Nyukimin/RenCrow_PORTAL",
      "workspace_path": "../RenCrow_PORTAL",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Web interaction profile for Chat and IdleChat through the allowlisted CORE Public API"
    },
    "assistant": {
      "repository": "Nyukimin/RenCrow_ASSISTANT",
      "workspace_path": "../RenCrow_ASSISTANT",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Stateful proactive interaction profile for personal and family routines, push delivery, devices, and optional CORE task escalation",
      "runtime": {
        "primary": {
          "implementation": "go",
          "artifact": "rencrow-assistant",
          "status": "planned"
        },
        "companions": []
      }
    },
    "cmd": {
      "repository": "Nyukimin/RenCrow_CMD",
      "workspace_path": "../RenCrow_CMD",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Terminal client and rencrowctl command facade for the CORE Public API, with process entrypoints for CORE and PORTAL"
    },
    "llm": {
      "repository": "Nyukimin/RenCrow_LLM",
      "workspace_path": "../RenCrow_LLM",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Go central LLM gateway for Execution Role profile to Inference Target mapping, backend adaptation, Host Node coordination, and response normalization",
      "runtime": {
        "primary": {
          "implementation": "go",
          "artifact": "rencrow-llm",
          "status": "development"
        },
        "companions": [
          {
            "id": "llm-target",
            "kind": "external-compute",
            "required": true,
            "bundled": false,
            "role": "LLM target composed of Backend, Model, weights, KV cache, and compute resources"
          }
        ]
      }
    },
    "stt": {
      "repository": "Nyukimin/RenCrow_STT",
      "workspace_path": "../RenCrow_STT",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Go STT gateway for public audio contracts, target adaptation, and transcript normalization",
      "runtime": {
        "primary": {
          "implementation": "go",
          "artifact": "rencrow-stt",
          "status": "development"
        },
        "companions": [
          {
            "id": "stt-target",
            "kind": "external-compute",
            "required": true,
            "bundled": false,
            "role": "STT target composed of transcription engine, Model, weights, decoder, and compute resources"
          }
        ]
      }
    },
    "tts": {
      "repository": "Nyukimin/RenCrow_TTS",
      "workspace_path": "../RenCrow_TTS",
      "version": "unpinned",
      "required": false,
      "distribution": "binary",
      "role": "Go TTS gateway for character, style, voice routing, and synthesis target adaptation",
      "runtime": {
        "primary": {
          "implementation": "go",
          "artifact": "rencrow-tts",
          "status": "development"
        },
        "companions": [
          {
            "id": "tts-target",
            "kind": "external-compute",
            "required": true,
            "bundled": false,
            "role": "TTS target composed of synthesis engine, Model, weights, voice assets, codec, and compute resources"
          }
        ]
      }
    },
    "vision": {
      "repository": "Nyukimin/RenCrow_Vision",
      "workspace_path": "../RenCrow_Vision",
      "version": "unpinned",
      "required": false,
      "distribution": "service",
      "role": "Mandatory image and video recognition interface from CORE to the Wild backend, including media validation, preprocessing, and result normalization"
    },
    "games": {
      "repository": "Nyukimin/RenCrow_GAMES",
      "workspace_path": "../RenCrow_GAMES",
      "version": "unpinned",
      "required": false,
      "distribution": "extension",
      "role": "CORE-initiated deterministic game execution, world/rule ownership, replay and observer UI, with turn decision callbacks through RenCrowBridge to CORE"
    },
    "tools": {
      "repository": "Nyukimin/RenCrow_Tools",
      "workspace_path": "../RenCrow_Tools",
      "version": "unpinned",
      "required": false,
      "distribution": "tooling",
      "role": "Reusable development, conversion, validation, and browser tools"
    },
    "image": {
      "repository": "Nyukimin/RenCrow_Image",
      "workspace_path": "../RenCrow_Image",
      "version": "unpinned",
      "required": false,
      "distribution": "service",
      "role": "Mandatory drawing and image-generation HTTP interface from CORE to ForgeNeo, Z-Image, or another configured backend"
    },
    "workspace": {
      "repository": "Nyukimin/RenCrow_Workspace",
      "workspace_path": "../RenCrow_Workspace",
      "version": "unpinned",
      "required": false,
      "distribution": "snapshot",
      "role": "Portable non-secret snapshot for backup and recovery of the canonical Ubuntu runtime workspace"
    }
  }
}
